name: Sector vNext QA

on:
  push:
    branches: [sector-vnext-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Upgrade isolated build toolchain
        run: npm install --save-dev vite@^8.2.2 @vitejs/plugin-react@^6.1.0

      - name: Block dependency vulnerabilities
        run: npm audit

      - name: Sector regression gates
        run: npm run verify:sector

      - name: Production frontend build
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python application
        run: python -m compileall -q api bot

      - name: Persist dependency updates only after all QA passes
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "sectorland-ci"
            git config user.email "actions@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "chore(deps): upgrade verified Vite toolchain"
            git push origin HEAD:sector-vnext-debug
          fi
